name: chronicles
description: bartulem's blog
url: https://bartulem.github.io

feed_items: 5
feed_update_period: weekly
feed_update_frequency: 1

markdown: kramdown
google_analytics: UA-157587935-1
permalink: pretty

# The chronicles (blog) section is retired from the published site but kept in
# the repository. To bring it back, remove chronicles, _posts and search.json
# from the exclude list below and uncomment the two paginate lines.
# paginate: 5
# paginate_path: "/chronicles/page:num/"

exclude:
  - chronicles
  - _posts
  - search.json
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
